[project]
name = "pyfolio-backend"
version = "0.1.0"
description = "Pyfolio portfolio tracking backend monorepo"
readme = "README.md"
authors = [
    { name = "Marco Wegner", email = "673439+marvey11@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

# --- Tooling Configurations ---

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (enforces explicit type annotations everywhere)
    "PYI", # flake8-pyi (type stub rules)
    "TCH", # flake8-type-checking (moves type-only imports into TYPE_CHECKING blocks)
    "FA",  # flake8-future-annotations (enforces `from __future__ import annotations`)
    "RUF", # Ruff-specific rules (includes type-check optimizations)
]
fixable = ["ALL"]
# S = flake8-bandit (Security checks)
extend-select = ["S"]

# Strict annotation configuration
[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-dummy-args = false
suppress-none-returning = false # Requires explicit -> None return types

[tool.ruff.lint.per-file-ignores]
# Allow 'assert' in tests (flake8-bandit rule S101)
"tests/**/*.py" = ["S101"]
"**/tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["core", "pyfolio_api"]

[tool.ruff.format]
# Use "double" or "single" quotes based on your preference
quote-style = "double"

# Ensures a trailing comma in multi-line lists/dicts (better for git diffs)
skip-magic-trailing-comma = false

# This handles the indent style (usually 4 spaces)
indent-style = "space"

[tool.mypy]
# Enable strict mode flags
strict = true

# Module resolution settings
explicit_package_bases = true
namespace_packages = true

# Ensure mypy finds packages inside src-layout structures if applicable
mypy_path = ["libs/core/src", "apps/pyfolio-api/src"]

# Disallow dynamic typing & ambiguous definitions
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

# Warnings and strict quality checks
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true
strict_equality = true

# Treat mypy configuration issues or unused suppressions strictly
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["apps", "libs"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["apps", "libs"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.paths]
source = ["libs/", "apps/"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["apps", "libs"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
